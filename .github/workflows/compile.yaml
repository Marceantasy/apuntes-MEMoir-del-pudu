name: Compile Handbook

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Typst
        run: |
          curl -L https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ --strip-components=1
          sudo install -m 755 typst /usr/local/bin/
          typst --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig poppler-utils fonts-firacode fonts-roboto

      - name: Compile documents
        run: |
          # Full compilation
          python make.py
          mv notebook.pdf notebook_full.pdf

          # Minified compilation for PDA
          python make.py --no-cover --no-index --no-pdfs --filename-font-size=10pt --section-font-size=12pt --margin=2.5mm --margin-top=10mm
          mv notebook.pdf notebook_pda.pdf

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          files: |
            notebook_full.pdf
            notebook_pda.pdf
          draft: false
          tag_name: "v${{ github.run_number }}"
          name: "Handbook v${{ github.run_number }}"
          body: "Compiled on ${{ github.event.head_commit.timestamp }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
